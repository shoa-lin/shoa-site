<rect width="720" height="358" rx="18" fill="#F5F4ED"/>
<text x="36" y="44" font-size="22" font-weight="500" fill="#141413">One thread in the loop</text>
<text x="36" y="66" font-size="13" fill="#73726C">Someone opens a thread; Claude takes it from there</text>
<rect x="150.5" y="88.5" width="533" height="122" rx="12" fill="none" stroke="#87867F" stroke-width="1" stroke-dasharray="4 4"/>
<text x="164" y="108" font-size="13" fill="#73726C">Claude</text>
<text x="36" y="132" font-size="13" font-weight="600" fill="#141413">Open a thread</text>
<text x="36" y="149" font-size="12" fill="#87867F">a slow stretch,</text>
<text x="36" y="164" font-size="12" fill="#87867F">a recording</text>
<text x="163" y="132" font-size="13" font-weight="600" fill="#141413">Build a benchmark</text>
<text x="163" y="149" font-size="12" fill="#87867F">trace it, reproduce</text>
<text x="163" y="164" font-size="12" fill="#87867F">in the lab</text>
<text x="290" y="132" font-size="13" font-weight="600" fill="#141413">Pull request</text>
<text x="290" y="149" font-size="12" fill="#87867F">several, sized</text>
<text x="290" y="164" font-size="12" fill="#87867F">for review</text>
<text x="417" y="132" font-size="13" font-weight="600" fill="#141413">Deploy</text>
<text x="417" y="149" font-size="12" fill="#87867F">behind a flag</text>
<text x="544" y="132" font-size="13" font-weight="600" fill="#141413">Read the field</text>
<text x="544" y="149" font-size="12" fill="#87867F">real users, by build</text>
<text x="544" y="164" font-size="12" fill="#87867F">and platform</text>
