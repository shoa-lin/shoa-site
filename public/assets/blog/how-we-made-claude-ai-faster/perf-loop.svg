<text x="563" y="270.5" font-size="13" font-weight="600" fill="#141413">It got faster</text>
<text x="563" y="287" font-size="12" fill="#87867F">ratchet the</text>
<text x="563" y="302" font-size="12" fill="#87867F">benchmark down</text>
<text x="436" y="270.5" font-size="13" font-weight="600" fill="#3D3D3A">It didn’t</text>
<text x="436" y="287" font-size="12" fill="#87867F">turn the flag off,</text>
<text x="436" y="302" font-size="12" fill="#87867F">iterate</text>
