<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" id="perf-count" width="720" height="352" viewBox="0 0 720 352" xmlns="http://www.w3.org/2000/svg"><style>#perf-count text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif}#perf-count .tnum{font-variant-numeric:tabular-nums}#perf-count .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>
<rect width="720" height="352" rx="18" fill="#F5F4ED"/>
<text x="36" y="44" font-size="22" font-weight="500" fill="#141413">Does the count track the clock?</text>
<text x="36" y="66" font-size="13" fill="#73726C">CPU instructions vs. wall-clock time</text>
<text x="36" y="104" font-size="13" fill="#87867F">Hot path</text>
<text x="242" y="104" font-size="13" fill="#87867F">CPU instructions</text>
<text x="419" y="104" font-size="13" fill="#87867F">Wall-clock</text>
<text x="684" y="104" text-anchor="end" font-size="13" fill="#87867F">Speedup</text>
<line x1="36" y1="116.5" x2="684" y2="116.5" stroke="#D1CFC5" stroke-width="1"/>
<text x="36" y="148" font-size="17" font-weight="500" fill="#141413">Message-tree assembly</text>
<text x="36" y="167" font-size="12" fill="#87867F">each message ID resolved</text>
<text x="36" y="182" font-size="12" fill="#87867F">once instead of three times</text>
<rect x="242" y="138" width="112" height="10" rx="2" fill="#B0ADA3"/>
<rect x="242" y="154" width="58.24" height="10" rx="2" fill="#D97757"/>
<text class="tnum" x="362" y="163.5" font-size="13" font-weight="600" fill="#141413">−48%</text>
<rect x="419" y="138" width="112" height="10" rx="2" fill="#B0ADA3"/>
<rect x="419" y="154" width="24.64" height="10" rx="2" fill="#D97757"/>
<text class="tnum" x="539" y="163.5" font-size="13" font-weight="600" fill="#141413">−78%</text>
<text class="tnum" x="684" y="163.5" text-anchor="end" font-size="12" fill="#141413"><tspan font-size="24" font-weight="600" fill="#141413">4.6x</tspan><tspan dx="4" font-size="12" fill="#87867F">faster</tspan></text>
<line x1="36" y1="206.5" x2="684" y2="206.5" stroke="#E8E6DC" stroke-width="1"/>
<text x="36" y="238" font-size="17" font-weight="500" fill="#141413">Status-line scanner</text>
<text x="36" y="257" font-size="12" fill="#87867F">cheap first-character</text>
<text x="36" y="272" font-size="12" fill="#87867F">check before the regex</text>
<rect x="242" y="228" width="112" height="10" rx="2" fill="#B0ADA3"/>
<rect x="242" y="244" width="77.28" height="10" rx="2" fill="#D97757"/>
<text class="tnum" x="362" y="253.5" font-size="13" font-weight="600" fill="#141413">−31%</text>
<rect x="419" y="228" width="112" height="10" rx="2" fill="#B0ADA3"/>
<rect x="419" y="244" width="62.72" height="10" rx="2" fill="#D97757"/>
<text class="tnum" x="539" y="253.5" font-size="13" font-weight="600" fill="#141413">−44%</text>
<text class="tnum" x="684" y="253.5" text-anchor="end" font-size="12" fill="#141413"><tspan font-size="24" font-weight="600" fill="#141413">1.8x</tspan><tspan dx="4" font-size="12" fill="#87867F">faster</tspan></text>
<text x="36" y="306" font-size="12" fill="#87867F"><tspan x="36">Two hot paths, instruction count against wall-clock time. Counts under Valgrind with <tspan class="mono">node --predictable</tspan>;</tspan><tspan x="36" dy="16">timings on the same benchmark under plain <tspan class="mono">node</tspan> with the JIT warm.</tspan></text>
</svg>
