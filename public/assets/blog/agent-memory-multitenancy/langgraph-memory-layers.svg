<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="740" fill="#FFFFFF"/>
  <text x="60" y="56" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827">LangGraph 多租户记忆隔离：三层原语</text>
  <text x="60" y="84" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#6B7280">会话、长期记忆、记忆形成——全部落在数据库的键空间隔离上</text>

  <!-- connectors (behind nodes) -->
  <path d="M 600 174 L 600 200" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 600 260 L 230 310" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 600 260 L 600 310" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 600 260 L 970 310" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 230 466 L 230 530" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 600 466 L 600 530" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 860 466 L 860 498 L 640 498 L 640 528" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1050 466 L 1050 528" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- gateway -->
  <rect x="430" y="110" width="340" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="138" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">API 网关 / 应用层</text>
  <text x="600" y="160" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#1E40AF">请求级身份注入：user_id / org_id</text>

  <!-- agent -->
  <rect x="430" y="204" width="340" height="56" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <text x="600" y="238" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#111827">Agent 应用（LangGraph graph）</text>

  <!-- layer 1 -->
  <rect x="60" y="316" width="340" height="150" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="230" y="348" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">① Checkpointer · thread_id</text>
  <text x="230" y="378" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">会话 / 任务级隔离</text>
  <text x="230" y="402" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">每个 thread_id 一条独立</text>
  <text x="230" y="426" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">checkpoint 链，彼此不可见</text>

  <!-- layer 2 -->
  <rect x="430" y="316" width="340" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="348" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#065F46">② Store · namespace</text>
  <text x="600" y="378" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">跨会话长期记忆（JSON 文档）</text>
  <text x="600" y="402" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">namespace = (org_id, user_id,</text>
  <text x="600" y="426" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">"memories")，前缀即租户边界</text>

  <!-- layer 3 -->
  <rect x="800" y="316" width="340" height="150" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="970" y="348" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#4C1D95">③ LangMem</text>
  <text x="970" y="378" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">记忆形成层</text>
  <text x="970" y="402" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">什么值得记、怎么提炼</text>
  <text x="970" y="426" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#374151">热路径 / 后台写入</text>

  <!-- postgres -->
  <rect x="60" y="536" width="680" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="400" y="572" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="700" fill="#78350F">PostgreSQL（开源后端）</text>
  <text x="400" y="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#92400E">checkpoint 表（短期）· store 表（长期）· pgvector 语义检索</text>
  <text x="400" y="624" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#92400E">同类开源后端：MongoDB / Redis / Upstash</text>

  <!-- risk callout -->
  <rect x="800" y="536" width="340" height="110" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="970" y="568" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#B91C1C">⚠ 隔离是约定，不是强制</text>
  <text x="970" y="594" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#7F1D1D">namespace 拼错一段 = 跨租户泄漏</text>
  <text x="970" y="616" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#7F1D1D">RBAC / 配额 / RLS 全部自己补</text>

  <text x="60" y="700" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#6B7280">三层核心均为 MIT 开源：langgraph · langgraph-checkpoint-postgres · langmem；收费分界线在 Agent Server 运行时（Elastic License 2.0）</text>
</svg>
