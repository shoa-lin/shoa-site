<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="#FFFFFF"/>
  <text x="60" y="56" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827">Agent 运行时格局："Kubernetes 时刻"还没到</text>
  <text x="60" y="84" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#6B7280">四条路线在抢同一层基础设施，各有硬伤（⭐ 数据：GitHub，2026-10）</text>

  <!-- connectors (behind) -->
  <path d="M 500 215 L 540 310" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <path d="M 700 215 L 660 310" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <path d="M 500 470 L 540 410" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <path d="M 700 470 L 660 410" fill="none" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- A: framework vendor -->
  <rect x="80" y="130" width="420" height="170" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="104" y="164" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#1E3A8A">路线 A：框架厂商一体化</text>
  <text x="104" y="192" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#1E40AF">LangGraph Platform（langgraph ⭐ 42.9k）</text>
  <text x="104" y="216" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">durable execution 工程完成度目前最高</text>
  <text x="104" y="240" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">硬伤：租户体系缺位 · Elastic 2.0 · 运行时耦合</text>

  <!-- B: neutral durable layer -->
  <rect x="700" y="130" width="420" height="170" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="724" y="164" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#065F46">路线 B：中立持久层</text>
  <text x="724" y="192" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#065F46">Temporal（⭐ 23.5k）+ 薄 agent 框架</text>
  <text x="724" y="216" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">多语言 · multi-region · 大厂十年验证</text>
  <text x="724" y="240" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">编排与运维解耦，迁出成本低</text>

  <!-- C: cloud vendors -->
  <rect x="80" y="470" width="420" height="150" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <text x="104" y="504" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#111827">路线 C：云厂商托管</text>
  <text x="104" y="532" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">AWS Bedrock AgentCore / Azure / GCP</text>
  <text x="104" y="556" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">合规证书 + 采购通道的天然优势</text>
  <text x="104" y="580" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">硬伤：绑定单一云，生态封闭</text>

  <!-- D: model vendors -->
  <rect x="700" y="470" width="420" height="150" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/>
  <text x="724" y="504" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="700" fill="#7C2D12">路线 D：模型厂商下沉</text>
  <text x="724" y="532" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#7C2D12">OpenAI stateful API / Anthropic Agent SDK</text>
  <text x="724" y="556" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">记忆与恢复沉入模型 API 层</text>
  <text x="724" y="580" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">若成标准，编排框架价值被抽空一块</text>

  <!-- hub -->
  <rect x="460" y="310" width="280" height="100" rx="10" fill="#111827"/>
  <text x="600" y="352" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" font-weight="700" fill="#F9FAFB">Agent 基础设施</text>
  <text x="600" y="382" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#D1D5DB">终局未定</text>

  <!-- bottom strip -->
  <rect x="80" y="640" width="1040" height="62" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="600" y="666" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">历史参照：2015 年容器编排混战（Mesos / Swarm / K8s），K8s 以「中立 + 组件化 + 厂商共建」胜出</text>
  <text x="600" y="688" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" fill="#374151">旁证：独立记忆层赛道 mem0 ⭐ 66.9k 已超过 langgraph 本体（42.9k）</text>
</svg>
