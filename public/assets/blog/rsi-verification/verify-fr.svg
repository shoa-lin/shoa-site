<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660" role="img" aria-label="Plus la notation est bon marché, plus tôt ça démarre : pour les noyaux et les compilateurs, l'effet composé joue déjà ; pour le code, les preuves mathématiques et le code de l'agent lui-même, c'est déjà en cours ; données et pipeline d'entraînement ne font que commencer ; orientations de recherche et objectifs d'alignement ne sont pas encore en vue" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="420" height="660" rx="16" fill="#f7f8fa"/>
  <text x="24" y="42" font-size="21" font-weight="700" fill="#1f2328">Notation peu chère, départ en tête</text>

  <!-- 纵轴：打一次分的代价 -->
  <text x="30" y="74" font-size="14" fill="#57606a" text-anchor="middle"><tspan x="30">Peu</tspan><tspan x="30" dy="15">cher</tspan></text>
  <line x1="30" y1="96" x2="30" y2="540" stroke="#57606a" stroke-width="2" marker-end="url(#down)"/>
  <text x="30" y="562" font-size="14" fill="#57606a" text-anchor="middle">Cher</text>

  <g font-size="15">
    <!-- 1 -->
    <rect x="52" y="66" width="352" height="84" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
    <text x="68" y="98" font-size="15" font-weight="700" fill="#1f2328">Noyaux, compilateurs</text>
    <text x="68" y="128" fill="#57606a">Notation : chronomètre, secondes</text>
    <rect x="260" y="80" width="130" height="28" rx="14" fill="#1a7f4b"/>
    <text x="325" y="99" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Effet composé</text>

    <!-- 2 -->
    <rect x="52" y="162" width="352" height="84" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
    <text x="68" y="194" font-size="15" font-weight="700" fill="#1f2328">Code, preuves</text>
    <text x="68" y="224" fill="#57606a">Notation : tests, vérificateurs de preuves</text>
    <rect x="303" y="176" width="87" height="28" rx="14" fill="#1a7f4b" fill-opacity="0.12" stroke="#1a7f4b"/>
    <text x="346.5" y="195" font-size="14" font-weight="700" fill="#1a7f4b" text-anchor="middle">En cours</text>

    <!-- 3 -->
    <rect x="52" y="258" width="352" height="84" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
    <text x="68" y="290" font-size="15" font-weight="700" fill="#1f2328">Code de l’agent lui-même</text>
    <text x="68" y="320" fill="#57606a">Notation : évaluations cachées, heures</text>
    <rect x="303" y="272" width="87" height="28" rx="14" fill="#1a7f4b" fill-opacity="0.12" stroke="#1a7f4b"/>
    <text x="346.5" y="291" font-size="14" font-weight="700" fill="#1a7f4b" text-anchor="middle">En cours</text>

    <!-- 4 -->
    <rect x="52" y="354" width="352" height="84" rx="12" fill="#ffffff" stroke="#c2570c" stroke-width="2"/>
    <text x="68" y="386" font-size="15" font-weight="700" fill="#1f2328">Données, entraînement</text>
    <text x="68" y="416" fill="#57606a">Notation : après l’entraînement, semaines</text>
    <rect x="313" y="368" width="77" height="28" rx="14" fill="#c2570c" fill-opacity="0.12" stroke="#c2570c"/>
    <text x="351.5" y="387" font-size="14" font-weight="700" fill="#c2570c" text-anchor="middle">Débute</text>

    <!-- 5 -->
    <rect x="52" y="450" width="352" height="84" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="68" y="482" font-size="15" font-weight="700" fill="#1f2328">Recherche, alignement</text>
    <text x="68" y="512" fill="#57606a">Notation : jugement humain, mois et plus</text>
    <rect x="288" y="464" width="102" height="28" rx="14" fill="#eaeef2" stroke="#8c959f"/>
    <text x="339" y="483" font-size="14" font-weight="700" fill="#57606a" text-anchor="middle">Pas en vue</text>
  </g>

  <!-- 说明 -->
  <rect x="16" y="580" width="388" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="606" font-size="14" font-weight="700" fill="#1f2328">Bon marché ne suffit pas, il faut mesurer juste :</text>
  <text x="32" y="630" font-size="14" fill="#57606a">qui ne mesure que le benchmark se fait contourner</text>
</svg>
