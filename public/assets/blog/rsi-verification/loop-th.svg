<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-label="งานสามอย่างในการปรับปรุงหนึ่งครั้ง: การตั้งเป้าหมายกำหนดว่าอะไรคือดีขึ้น และยังเป็นหน้าที่ของคน การเสนอวิธีเปลี่ยนส่งต่อให้ AI แล้ว การให้คะแนนกำลังถูกส่งต่อ โดยคนยังเป็นด่านสุดท้ายอยู่ การเปลี่ยนที่ดีถูกเก็บไว้และเข้าสู่รอบถัดไป" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#175cd3"/>
    </marker>
  </defs>
  <rect width="420" height="620" rx="16" fill="#f7f8fa"/>
  <text x="24" y="42" font-size="22" font-weight="700" fill="#1f2328">งานสามอย่างในการปรับปรุงหนึ่งครั้ง</text>

  <!-- 定目标 -->
  <rect x="56" y="66" width="308" height="78" rx="12" fill="#ffffff" stroke="#175cd3" stroke-width="2"/>
  <text x="74" y="98" font-size="19" font-weight="700" fill="#1f2328">ตั้งเป้าหมาย</text>
  <text x="74" y="126" font-size="15" fill="#57606a">กำหนดว่า &quot;ดีขึ้น&quot; คืออะไร</text>
  <rect x="299" y="80" width="49" height="28" rx="14" fill="#175cd3" fill-opacity="0.12" stroke="#175cd3"/>
  <text x="323.5" y="99" font-size="15" font-weight="700" fill="#175cd3" text-anchor="middle">คน</text>

  <!-- 出改法 -->
  <rect x="56" y="184" width="308" height="78" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
  <text x="74" y="216" font-size="19" font-weight="700" fill="#1f2328">เสนอวิธีเปลี่ยน</text>
  <text x="74" y="244" font-size="15" fill="#57606a">เสนอการเปลี่ยนแปลงแล้วลงมือทำเอง</text>
  <rect x="234" y="198" width="114" height="28" rx="14" fill="#1a7f4b" fill-opacity="0.12" stroke="#1a7f4b"/>
  <text x="291" y="217" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="middle">AI รับไปแล้ว</text>

  <!-- 打分 -->
  <rect x="56" y="302" width="308" height="78" rx="12" fill="#ffffff" stroke="#c2570c" stroke-width="2"/>
  <text x="74" y="334" font-size="19" font-weight="700" fill="#1f2328">ให้คะแนน</text>
  <text x="74" y="362" font-size="15" fill="#57606a">พิสูจน์ว่ามันดีขึ้นจริง</text>
  <rect x="247" y="316" width="101" height="28" rx="14" fill="#c2570c" fill-opacity="0.12" stroke="#c2570c"/>
  <text x="297.5" y="335" font-size="15" font-weight="700" fill="#c2570c" text-anchor="middle">กำลังส่งต่อ</text>

  <!-- 留下 -->
  <rect x="56" y="420" width="308" height="66" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="74" y="450" font-size="19" font-weight="700" fill="#1f2328">เก็บไว้</text>
  <text x="74" y="474" font-size="15" fill="#57606a">เก็บอันที่ดี แล้วเข้าสู่รอบถัดไป</text>

  <!-- 圈内箭头 -->
  <line x1="210" y1="262" x2="210" y2="298" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="380" x2="210" y2="416" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 下一圈：从留下回到出改法 -->
  <path d="M56 453 H34 V223 H52" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="26" y="340" font-size="15" fill="#57606a" text-anchor="middle" transform="rotate(-90 26 340)">รอบถัดไป</text>
  <!-- 定目标决定打分的尺子 -->
  <path d="M364 105 H388 V341 H368" fill="none" stroke="#175cd3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <text x="398" y="223" font-size="15" fill="#175cd3" text-anchor="middle" transform="rotate(90 398 223)">อะไรคือดี</text>

  <!-- 说明 -->
  <rect x="16" y="510" width="388" height="94" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="540" font-size="15" fill="#57606a">สีแสดงสถานะในปี 2026</text>
  <text x="32" y="568" font-size="16" font-weight="700" fill="#1f2328">RSI: ส่งงานทั้งสามอย่างให้ AI</text>
  <text x="32" y="592" font-size="16" font-weight="700" fill="#1f2328">และทุกรอบต้องทำให้รอบถัดไปดีขึ้น</text>
</svg>
