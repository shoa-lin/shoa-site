<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-label="한 번의 개선에 있는 세 가지 일: 목표 정하기는 무엇이 더 나은지를 규정하며 여전히 사람이 한다. 개선안 내기는 이미 AI에게 넘어갔다. 점수 매기기는 넘어가는 중이고 아직 사람이 최후의 안전망이다. 좋은 변경은 남겨 다음 바퀴로 간다" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#175cd3"/>
    </marker>
  </defs>
  <rect width="420" height="620" rx="16" fill="#f7f8fa"/>
  <text x="24" y="42" font-size="22" font-weight="700" fill="#1f2328">한 번의 개선에 있는 세 가지 일</text>

  <!-- 定目标 -->
  <rect x="56" y="66" width="308" height="78" rx="12" fill="#ffffff" stroke="#175cd3" stroke-width="2"/>
  <text x="74" y="98" font-size="19" font-weight="700" fill="#1f2328">목표 정하기</text>
  <text x="74" y="126" font-size="15" fill="#57606a">'더 나은 것'이 무엇인지 규정</text>
  <rect x="291" y="80" width="57" height="28" rx="14" fill="#175cd3" fill-opacity="0.12" stroke="#175cd3"/>
  <text x="319.5" y="99" font-size="15" font-weight="700" fill="#175cd3" text-anchor="middle">사람</text>

  <!-- 出改法 -->
  <rect x="56" y="184" width="308" height="78" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
  <text x="74" y="216" font-size="19" font-weight="700" fill="#1f2328">개선안 내기</text>
  <text x="74" y="244" font-size="15" fill="#57606a">변경을 제안하고 직접 실행</text>
  <rect x="257" y="198" width="91" height="28" rx="14" fill="#1a7f4b" fill-opacity="0.12" stroke="#1a7f4b"/>
  <text x="302.5" y="217" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="middle">AI가 맡음</text>

  <!-- 打分 -->
  <rect x="56" y="302" width="308" height="78" rx="12" fill="#ffffff" stroke="#c2570c" stroke-width="2"/>
  <text x="74" y="334" font-size="19" font-weight="700" fill="#1f2328">점수 매기기</text>
  <text x="74" y="362" font-size="15" fill="#57606a">정말 나아졌음을 증명</text>
  <rect x="246" y="316" width="102" height="28" rx="14" fill="#c2570c" fill-opacity="0.12" stroke="#c2570c"/>
  <text x="297" y="335" font-size="15" font-weight="700" fill="#c2570c" text-anchor="middle">넘겨주는 중</text>

  <!-- 留下 -->
  <rect x="56" y="420" width="308" height="66" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="74" y="450" font-size="19" font-weight="700" fill="#1f2328">남기기</text>
  <text x="74" y="474" font-size="15" fill="#57606a">좋은 것은 남겨 다음 바퀴로</text>

  <!-- 圈内箭头 -->
  <line x1="210" y1="262" x2="210" y2="298" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="380" x2="210" y2="416" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 下一圈：从留下回到出改法 -->
  <path d="M56 453 H34 V223 H52" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="26" y="340" font-size="15" fill="#57606a" text-anchor="middle" transform="rotate(-90 26 340)">다음 바퀴</text>
  <!-- 定目标决定打分的尺子 -->
  <path d="M364 105 H388 V341 H368" fill="none" stroke="#175cd3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <text x="398" y="223" font-size="15" fill="#175cd3" text-anchor="middle" transform="rotate(90 398 223)">무엇이 좋은가</text>

  <!-- 说明 -->
  <rect x="16" y="510" width="388" height="94" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="540" font-size="15" fill="#57606a">색은 2026년의 상태</text>
  <text x="32" y="568" font-size="16" font-weight="700" fill="#1f2328">RSI: 세 가지 일을 모두 AI에게 넘기고,</text>
  <text x="32" y="592" font-size="16" font-weight="700" fill="#1f2328">한 바퀴마다 다음 바퀴가 더 잘 돌게</text>
</svg>
