<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-label="ในกล่องแชต บริบทกับสิทธิ์แทบไม่ซ้อนทับกัน ใน repository ทั้งสองซ้อนทับกันเป็นบริเวณกว้าง อีกทั้ง git ย้อนกลับได้และเทสต์ตรวจรับได้" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="420" height="600" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="20" font-weight="700" fill="#1f2328">Repository: สองแกนซ้อนกันครั้งแรก</text>

  <!-- 聊天框 -->
  <rect x="16" y="62" width="388" height="206" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="92" font-size="19" font-weight="700" fill="#1f2328">ในกล่องแชต</text>
  <circle cx="140" cy="166" r="56" fill="#1a7f4b" fill-opacity="0.14" stroke="#1a7f4b" stroke-width="2"/>
  <text x="140" y="172" font-size="17" fill="#1a7f4b" text-anchor="middle">บริบท</text>
  <circle cx="292" cy="166" r="26" fill="#c2570c" fill-opacity="0.14" stroke="#c2570c" stroke-width="2"/>
  <text x="292" y="172" font-size="17" fill="#c2570c" text-anchor="middle">สิทธิ์</text>
  <text x="210" y="250" font-size="17" fill="#1f2328" text-anchor="middle">รู้ว่าคุณพูดอะไร แต่ทำได้แค่ตอบ</text>

  <!-- 仓库 -->
  <rect x="16" y="284" width="388" height="296" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="314" font-size="19" font-weight="700" fill="#1f2328">ใน repository</text>
  <circle cx="180" cy="402" r="66" fill="#1a7f4b" fill-opacity="0.14" stroke="#1a7f4b" stroke-width="2"/>
  <circle cx="240" cy="402" r="66" fill="#c2570c" fill-opacity="0.14" stroke="#c2570c" stroke-width="2"/>
  <text x="145" y="408" font-size="17" fill="#1a7f4b" text-anchor="middle">บริบท</text>
  <text x="210" y="408" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">ซ้อนทับ</text>
  <text x="277" y="408" font-size="17" fill="#c2570c" text-anchor="middle">สิทธิ์</text>
  <g font-size="17" fill="#1f2328">
    <text x="32" y="500"><tspan fill="#1a7f4b" font-weight="700">บริบท</tspan>: โค้ด ประวัติ เทสต์</text>
    <text x="32" y="528"><tspan fill="#c2570c" font-weight="700">สิทธิ์</tspan>: แก้ไฟล์ รันคำสั่ง</text>
    <text x="32" y="556" font-weight="700">git ย้อนกลับได้ เทสต์ตรวจรับได้</text>
  </g>
</svg>
