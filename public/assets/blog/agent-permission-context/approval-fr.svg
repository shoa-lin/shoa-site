<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-label="Les permissions dépassent le contexte d’une longueur ; l’écart est comblé par l’humain : fenêtres d’approbation, règles écrites à l’avance, mémoire et préférences accumulées ; les mots de passe sont le morceau volontairement non comblé" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="420" height="600" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="17" font-weight="700" fill="#1f2328">L’approbation : l’humain comble le contexte</text>

  <!-- 两根条 -->
  <text x="24" y="84" font-size="17" font-weight="700" fill="#c2570c">Permissions</text>
  <rect x="24" y="94" width="372" height="32" rx="6" fill="#c2570c" fill-opacity="0.16" stroke="#c2570c"/>
  <text x="40" y="116" font-size="17" fill="#1f2328">Connecté comme vous : tout se clique</text>

  <text x="24" y="160" font-size="17" font-weight="700" fill="#1a7f4b">Contexte</text>
  <rect x="24" y="170" width="190" height="32" rx="6" fill="#1a7f4b" fill-opacity="0.16" stroke="#1a7f4b"/>
  <text x="40" y="192" font-size="17" fill="#1f2328">Ce qu’il sait</text>
  <rect x="218" y="170" width="178" height="32" rx="6" fill="none" stroke="#c2570c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="307" y="192" font-size="17" font-weight="700" fill="#c2570c" text-anchor="middle">L’écart</text>
  <text x="307" y="232" font-size="15" fill="#1f2328" text-anchor="middle">À combler par l’humain</text>

  <!-- 三种补法 -->
  <g font-size="17" fill="#1f2328">
    <rect x="24" y="252" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="252" width="6" height="74" rx="3" fill="#c2570c"/>
    <text x="44" y="282" font-weight="700">Une approbation</text>
    <text x="44" y="310" font-size="16">Un petit bout : ce geste, oui ou non ?</text>

    <rect x="24" y="338" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="338" width="6" height="74" rx="3" fill="#2563c9"/>
    <text x="44" y="368" font-weight="700">Des règles écrites à l’avance</text>
    <text x="44" y="396" font-size="15">D’un coup : autorisé, à approuver, interdit</text>

    <rect x="24" y="424" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="424" width="6" height="74" rx="3" fill="#1a7f4b"/>
    <text x="44" y="454" font-weight="700">Accumuler mémoire et préférences</text>
    <text x="44" y="482">Contexte rattrapé, moins de pop-ups</text>
  </g>

  <!-- 例外 -->
  <text x="24" y="538" font-size="17" font-weight="700" fill="#1f2328">L’exception voulue : les mots de passe</text>
  <text x="24" y="566" font-size="17" fill="#57606a">L’agent s’en sert, mais ne les voit pas</text>
</svg>
