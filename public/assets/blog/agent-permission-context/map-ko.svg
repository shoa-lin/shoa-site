<svg xmlns="http://www.w3.org/2000/svg" width="420" height="740" viewBox="0 0 420 740" role="img" aria-label="권한 × 맥락 2차원 지도: 가로축은 권한 범위, 세로축은 맥락 범위이며, 일곱 묶음의 제품이 글쓴이의 판단에 따라 놓여 있다" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="420" height="740" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="22" font-weight="700" fill="#1f2328">권한 × 맥락</text>
  <text x="24" y="68" font-size="15" fill="#57606a">각 제품의 위치는 글쓴이의 판단이다</text>
  <text x="24" y="98" font-size="15" fill="#57606a">↑ 맥락: 무엇을 알고, 무엇을 간직하는가</text>

  <!-- 绘图区 -->
  <rect x="70" y="108" width="334" height="300" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="70" y1="168" x2="404" y2="168"/>
    <line x1="70" y1="228" x2="404" y2="228"/>
    <line x1="70" y1="288" x2="404" y2="288"/>
    <line x1="70" y1="348" x2="404" y2="348"/>
    <line x1="136.8" y1="108" x2="136.8" y2="408"/>
    <line x1="203.6" y1="108" x2="203.6" y2="408"/>
    <line x1="270.4" y1="108" x2="270.4" y2="408"/>
    <line x1="337.2" y1="108" x2="337.2" y2="408"/>
  </g>

  <!-- 纵轴刻度 -->
  <g font-size="15" fill="#57606a" text-anchor="end">
    <text x="62" y="143">팀</text>
    <text x="62" y="203">계정</text>
    <text x="62" y="263">메모리</text>
    <text x="62" y="323">파일</text>
    <text x="62" y="383">대화</text>
  </g>

  <!-- 横轴刻度 -->
  <g font-size="15" fill="#57606a" text-anchor="middle">
    <text x="103.4" y="432">답변</text>
    <text x="170.2" y="432">저장소</text>
    <text x="237" y="432">로컬</text>
    <text x="303.8" y="432">컴퓨터 한 대</text>
    <text x="370.6" y="432">팀</text>
  </g>
  <text x="404" y="462" font-size="15" fill="#57606a" text-anchor="end">권한: 무엇에 손댈 수 있는가 →</text>

  <!-- 对角线：两轴一起走 -->
  <line x1="103.4" y1="378" x2="370.6" y2="138" stroke="#2563c9" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 产品点 -->
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="103.4" cy="378" r="13" fill="#2563c9"/><text x="103.4" y="383">1</text>
    <circle cx="170.2" cy="318" r="13" fill="#2563c9"/><text x="170.2" y="323">2</text>
    <circle cx="237" cy="318" r="13" fill="#c2570c"/><text x="237" y="323">3</text>
    <circle cx="237" cy="258" r="13" fill="#1a7f4b"/><text x="237" y="263">4</text>
    <circle cx="292" cy="236" r="13" fill="#c2570c"/><text x="292" y="241">5</text>
    <circle cx="318" cy="190" r="13" fill="#c2570c"/><text x="318" y="195">6</text>
    <circle cx="370.6" cy="138" r="13" fill="#2563c9"/><text x="370.6" y="143">7</text>
  </g>

  <!-- 颜色说明 -->
  <g font-size="15" fill="#1f2328">
    <rect x="24" y="486" width="12" height="12" rx="3" fill="#2563c9"/><text x="42" y="497">두 축 함께</text>
    <rect x="124" y="486" width="12" height="12" rx="3" fill="#1a7f4b"/><text x="142" y="497">맥락 먼저</text>
    <rect x="240" y="486" width="12" height="12" rx="3" fill="#c2570c"/><text x="258" y="497">권한 먼저</text>
  </g>

  <!-- 图例 -->
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="36" cy="534" r="11" fill="#2563c9"/><text x="36" y="539">1</text>
    <circle cx="36" cy="564" r="11" fill="#2563c9"/><text x="36" y="569">2</text>
    <circle cx="36" cy="594" r="11" fill="#c2570c"/><text x="36" y="599">3</text>
    <circle cx="36" cy="624" r="11" fill="#1a7f4b"/><text x="36" y="629">4</text>
    <circle cx="36" cy="654" r="11" fill="#c2570c"/><text x="36" y="659">5</text>
    <circle cx="36" cy="684" r="11" fill="#c2570c"/><text x="36" y="689">6</text>
    <circle cx="36" cy="714" r="11" fill="#2563c9"/><text x="36" y="719">7</text>
  </g>
  <g font-size="17" fill="#1f2328">
    <text x="58" y="540">ChatGPT 대화</text>
    <text x="58" y="570">Codex, Claude Code</text>
    <text x="58" y="600">Cowork, Codex 데스크톱</text>
    <text x="58" y="630">OpenClaw, Hermes</text>
    <text x="58" y="660">Grok Bot</text>
    <text x="58" y="690">Muse, Dots</text>
    <text x="58" y="720">Claude Tag</text>
  </g>
</svg>
