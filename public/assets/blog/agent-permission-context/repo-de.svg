<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-label="Im Chatfenster überschneiden sich Kontext und Rechte kaum; im Repository überlappen sie großflächig, und git kann zurückrollen, Tests können abnehmen" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="420" height="600" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="20" font-weight="700" fill="#1f2328">Repository: erste Überschneidung</text>

  <!-- 聊天框 -->
  <rect x="16" y="62" width="388" height="206" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="92" font-size="19" font-weight="700" fill="#1f2328">Im Chatfenster</text>
  <circle cx="140" cy="166" r="56" fill="#1a7f4b" fill-opacity="0.14" stroke="#1a7f4b" stroke-width="2"/>
  <text x="140" y="172" font-size="17" fill="#1a7f4b" text-anchor="middle">Kontext</text>
  <circle cx="292" cy="166" r="26" fill="#c2570c" fill-opacity="0.14" stroke="#c2570c" stroke-width="2"/>
  <text x="292" y="172" font-size="15" fill="#c2570c" text-anchor="middle">Rechte</text>
  <text x="210" y="250" font-size="15" fill="#1f2328" text-anchor="middle">Weiß, was Sie sagen, kann aber nur antworten</text>

  <!-- 仓库 -->
  <rect x="16" y="284" width="388" height="296" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="314" font-size="19" font-weight="700" fill="#1f2328">Im Repository</text>
  <circle cx="180" cy="402" r="66" fill="#1a7f4b" fill-opacity="0.14" stroke="#1a7f4b" stroke-width="2"/>
  <circle cx="240" cy="402" r="66" fill="#c2570c" fill-opacity="0.14" stroke="#c2570c" stroke-width="2"/>
  <text x="145" y="408" font-size="17" fill="#1a7f4b" text-anchor="middle">Kontext</text>
  <text x="210" y="408" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Deckung</text>
  <text x="277" y="408" font-size="17" fill="#c2570c" text-anchor="middle">Rechte</text>
  <g font-size="17" fill="#1f2328">
    <text x="32" y="500"><tspan fill="#1a7f4b" font-weight="700">Kontext</tspan>: Code, Historie, Tests</text>
    <text x="32" y="528" font-size="15"><tspan fill="#c2570c" font-weight="700">Rechte</tspan>: Dateien ändern, Befehle ausführen</text>
    <text x="32" y="556" font-weight="700">git macht rückgängig, Tests prüfen ab</text>
  </g>
</svg>
