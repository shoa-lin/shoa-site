<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-label="权限比上下文长出一截，这段差距靠人补：弹窗批准、事先写规则、攒下记忆和偏好；密码是故意不补的一块" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="420" height="600" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="22" font-weight="700" fill="#1f2328">审批，是人在补上下文</text>

  <!-- 两根条 -->
  <text x="24" y="84" font-size="17" font-weight="700" fill="#c2570c">权限</text>
  <rect x="24" y="94" width="372" height="32" rx="6" fill="#c2570c" fill-opacity="0.16" stroke="#c2570c"/>
  <text x="40" y="116" font-size="17" fill="#1f2328">登录了你的账号，按钮都点得了</text>

  <text x="24" y="160" font-size="17" font-weight="700" fill="#1a7f4b">上下文</text>
  <rect x="24" y="170" width="190" height="32" rx="6" fill="#1a7f4b" fill-opacity="0.16" stroke="#1a7f4b"/>
  <text x="40" y="192" font-size="17" fill="#1f2328">它知道的</text>
  <rect x="218" y="170" width="178" height="32" rx="6" fill="none" stroke="#c2570c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="307" y="192" font-size="17" font-weight="700" fill="#c2570c" text-anchor="middle">差距</text>
  <text x="307" y="232" font-size="17" fill="#1f2328" text-anchor="middle">这块得靠人来补</text>

  <!-- 三种补法 -->
  <g font-size="17" fill="#1f2328">
    <rect x="24" y="252" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="252" width="6" height="74" rx="3" fill="#c2570c"/>
    <text x="44" y="282" font-weight="700">弹一次批准</text>
    <text x="44" y="310">补一小块：这一下行不行</text>

    <rect x="24" y="338" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="338" width="6" height="74" rx="3" fill="#2563c9"/>
    <text x="44" y="368" font-weight="700">事先写好规则</text>
    <text x="44" y="396">一次交出去：允许、要批准、禁止</text>

    <rect x="24" y="424" width="372" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="24" y="424" width="6" height="74" rx="3" fill="#1a7f4b"/>
    <text x="44" y="454" font-weight="700">攒下记忆和偏好</text>
    <text x="44" y="482">上下文追上来，弹窗才会变少</text>
  </g>

  <!-- 例外 -->
  <text x="24" y="538" font-size="17" font-weight="700" fill="#1f2328">故意不补的一块：密码</text>
  <text x="24" y="566" font-size="17" fill="#57606a">agent 可以用，但看不见</text>
</svg>
