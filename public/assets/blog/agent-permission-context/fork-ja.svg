<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" lang="ja" aria-label="リポジトリを離れたあとの分岐：一方はまずコンテキストを厚くし、もう一方はまず権限を広げ、最後はどちらももう一方の軸を補う" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <marker id="fork-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="420" height="600" rx="16" fill="#f7f8fa"/>

  <text x="24" y="42" font-size="22" font-weight="700" fill="#1f2328">リポジトリを離れると、道は二手に</text>

  <!-- 起点 -->
  <rect x="60" y="62" width="300" height="104" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g font-size="17" fill="#1f2328" text-anchor="middle">
    <text x="210" y="92" font-weight="700">リポジトリを離れたあと</text>
    <text x="210" y="122" font-size="15">コンテキストは会話やアカウントに分散</text>
    <text x="210" y="150">権限はサイトやアプリに分散</text>
  </g>

  <!-- 分叉 -->
  <path d="M210 166 V188 L109 222" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <path d="M210 188 L311 222" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#fork-arrow)"/>

  <!-- 左：先厚上下文 -->
  <rect x="16" y="228" width="186" height="252" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="2"/>
  <g font-size="17" fill="#1f2328" text-anchor="middle">
    <text x="109" y="260" font-weight="700" fill="#1a7f4b" font-size="15">まずコンテキストを厚く</text>
    <text x="109" y="294">いつものチャットへ</text>
    <text x="109" y="320">メモリと会話は手元に</text>
    <text x="109" y="354" fill="#57606a">OpenClaw</text>
    <text x="109" y="378" fill="#57606a">Hermes</text>
    <text x="109" y="430" font-weight="700">残る借り</text>
    <text x="109" y="456">動かせる範囲が狭い</text>
  </g>
  <line x1="36" y1="400" x2="182" y2="400" stroke="#eaeef2" stroke-width="2"/>

  <!-- 右：先宽权限 -->
  <rect x="218" y="228" width="186" height="252" rx="12" fill="#ffffff" stroke="#c2570c" stroke-width="2"/>
  <g font-size="17" fill="#1f2328" text-anchor="middle">
    <text x="311" y="260" font-weight="700" fill="#c2570c">まず権限を広く</text>
    <text x="311" y="294" font-size="15">agent に PC を一台</text>
    <text x="311" y="320">サイトにログインする</text>
    <text x="311" y="354" fill="#57606a">Grok Bot</text>
    <text x="311" y="378" fill="#57606a">Muse</text>
    <text x="311" y="430" font-weight="700">残る借り</text>
    <text x="311" y="456" font-size="14">あなたのルールを知らない</text>
  </g>
  <line x1="238" y1="400" x2="384" y2="400" stroke="#eaeef2" stroke-width="2"/>

  <!-- 汇合 -->
  <path d="M109 480 L190 512" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <path d="M311 480 L230 512" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <rect x="70" y="518" width="280" height="56" rx="12" fill="#1f2328"/>
  <text x="210" y="552" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">次の一手：どちらももう一方の軸を補う</text>
</svg>
